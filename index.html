<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Liberate</title>

    <!-- component embed를 지원하지 않는 상황을 위한 기본 Open Graph 태그 -->
    <meta property="og:title" content="Liberate" />
    <meta property="og:description" content="Discord component-embed 테스트 페이지" />
    <meta property="og:url" content="{{PAGE_URL}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 이 페이지의 실제 origin을 기준으로 절대 URL이 런타임에 주입됩니다 (src/index.js 참고) -->
    <link
      rel="discord:component-embed"
      type="application/json"
      href="{{EMBED_JSON_URL}}"
    />
  </head>
  <body>
    <p>이 페이지는 discord:component-embed 테스트용이며, Discordbot 크롤러에게만 노출됩니다.</p>
  </body>
</html>
